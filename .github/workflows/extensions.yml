name: Reader extension contracts
on:
  pull_request:
    branches: [personal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.35.3'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate local test-only TLS certificates
        run: sh test/support/generate_tls.sh "$RUNNER_TEMP/anx-tls"
      - name: Run reader and extension regression tests
        env:
          ANX_TLS_TEST_DIR: ${{ runner.temp }}/anx-tls
        run: flutter test $(find test -name '*_test.dart' ! -name 'get_page_file_test.dart') --reporter expanded
      - name: Check extension source
        run: flutter analyze --no-pub lib/service/extensions lib/widgets/extensions lib/service/ai/tools/extension_tool.dart
